services:
  - type: web
    name: shieldscan-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements-rag.txt && python scripts/build_threat_index.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: SHIELDSCAN_RETRIEVAL_PROVIDER
        value: lancedb
      - key: SHIELDSCAN_LANCEDB_PATH
        value: data/lancedb
      - key: GEMINI_API_KEY
        sync: false
